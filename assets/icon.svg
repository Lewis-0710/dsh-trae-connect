<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景：TraeWork 风格圆角深色底座 -->
  <rect width="64" height="64" rx="14" fill="url(#trae_bg_grad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
  
  <!-- 外框终端窗口：Trae 官方标志性带左下角缺口的光标方框 -->
  <!-- 顶部横条、右侧竖条、左侧竖条、底部横条（左侧向内凹陷折角） -->
  <path d="M15 17C15 16.4477 15.4477 16 16 16H48C48.5523 16 49 16.4477 49 17V43C49 43.5523 48.5523 44 48 44H23C22.4477 44 22 43.5523 22 43V38C22 37.4477 21.5523 37 21 37H16C15.4477 37 15 36.5523 15 36V17Z" fill="none" stroke="url(#trae_accent_grad)" stroke-width="4.8" stroke-linejoin="miter"/>

  <!-- 双眼：Trae 标志性旋转45度菱形钻石眼 -->
  <!-- 左眼：中心约在 (29, 29) -->
  <rect x="26.5" y="29" width="5" height="5" rx="0.6" transform="rotate(-45 26.5 29)" fill="url(#trae_accent_grad)"/>
  
  <!-- 右眼：中心约在 (38, 29) -->
  <rect x="35.5" y="29" width="5" height="5" rx="0.6" transform="rotate(-45 35.5 29)" fill="url(#trae_accent_grad)"/>

  <defs>
    <linearGradient id="trae_bg_grad" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161A1D"/>
      <stop offset="100%" stop-color="#0C0E10"/>
    </linearGradient>
    <linearGradient id="trae_accent_grad" x1="15" y1="16" x2="49" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38FF9A"/>
      <stop offset="100%" stop-color="#22E584"/>
    </linearGradient>
  </defs>
</svg>
